name: Run audio analysis

on:
  push:
    branches: [main]
    paths-ignore:
      - "outputs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the analysis
        run: python audio_analysis.py

      - name: Show the results on the run page
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat outputs/results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the plots as a download
        uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: outputs/

      - name: Save the plots back into the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs
          git diff --staged --quiet || (git commit -m "Update outputs from automatic run" && git push)
