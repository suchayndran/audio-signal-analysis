
name: Run audio analysis

on:
  push:
    paths:
      - '*.wav'
      - 'audio_analysis.py'
      - 'requirements.txt'
      - '.github/workflows/run-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analyze audio
        run: |
          WAV=$(find . -maxdepth 1 -name '*.wav' ! -name 'filtered.wav' ! -name 'test_signal.wav' | head -n 1)

          if [ -n "$WAV" ]; then
            echo "Using uploaded audio: $WAV"
            python audio_analysis.py --input "$WAV"
          else
            echo "No input WAV found. Using built-in sample."
            python audio_analysis.py
          fi

      - name: Upload analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: analysis-output
          path: outputs/
          if-no-files-found: error
